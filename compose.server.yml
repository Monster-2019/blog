name: blog

# 服务器生产部署：镜像由 GitHub Actions 推送到阿里云 ACR，
# 服务器只负责拉取并运行镜像。公网流量由 Nginx/Caddy 反代到 127.0.0.1:3000。
services:
  blog:
    container_name: blog
    image: registry.cn-hangzhou.aliyuncs.com/dongxin/blog:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
